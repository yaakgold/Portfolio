name: deploy.yml
on:
  workflow_dispatch:
    push:
      branches:
        - main
        -
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v2

      -name: Install dependencies
        run: npm install

      -name: Deploy with PM2
        run: |
          pm2 stop all || true
          pm2 start ./Portfolio/start.sh
          pm2 save
