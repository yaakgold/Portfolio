<mat-dialog-content style="background-color: #5b555d">
  <mat-card style="max-width: 800px; background-color: #5b555d">
    <mat-card-header>
      <mat-card-title>{{data.slide.title}}</mat-card-title>
      <mat-card-subtitle>{{data.slide.subtitle}}</mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image src="{{data.slide.url}}"
    style="width: 600px"
    >
    <mat-card-content>
      {{data.slide.description}}
    </mat-card-content>

    <mat-card-actions>
      <a href="{{data.slide.linkToCode}}" target="_blank" mat-button>Go to code</a>
    </mat-card-actions>
  </mat-card>
</mat-dialog-content>
