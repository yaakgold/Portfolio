<div id="mainPage">
  <mat-grid-list cols="10">
    <mat-grid-tile
      [colspan]="6"
      [rowspan]="3"
      [style.background]="'#7a4d8c'">
      <mat-card id="sectOne">
        <mat-card-title><h2>Game Developer</h2></mat-card-title>
        <mat-card-content>
          <h1>Ya'akov<br/>Goldberg</h1>
        </mat-card-content>
      </mat-card>
    </mat-grid-tile>
    <mat-grid-tile
      [colspan]="4"
      [rowspan]="5"
      [style.background]="'#805f8d'">
      <div class="slides">
        <mat-card id="sectTwo"
                  [ngStyle]="{opacity: hidden ? 0 : 1,
                              transition: 'opacity ' + animationSpeed + 'ms ease-in-out',
                              'background-color': '#7a4d8c',
                              'padding': '10px'}">
          <mat-card-title><h2>{{slides[currentSlide].title}}</h2></mat-card-title>
          <mat-card-subtitle><h3>{{slides[currentSlide].subtitle}}</h3></mat-card-subtitle>
          <img src="{{slides[currentSlide].url}}" alt="Photo of a Shiba Inu"
          style="width: 500px;"
          >
          <mat-card-content>
            <p>
              <br/>
              {{slides[currentSlide].shortDescription}}
            </p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button color="secondary" (click)="openDialog(dialog, slides[currentSlide])">View Game</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </mat-grid-tile>

    <mat-grid-tile
      [colspan]="6"
      [rowspan]="2"
      [style.background]="'#7a4d8c'">
      <a mat-stroked-button href="mailto:yaakovgoldberg007@gmail.com"><h3><u>Email me</u></h3></a>
    </mat-grid-tile>
  </mat-grid-list>
</div>
