<div class="resume-section">
  <a matButton="filled" (click)="downloadFile()"><mat-icon>download</mat-icon> Download Resume</a>

  <mat-accordion>
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Work Experience</mat-panel-title>
      </mat-expansion-panel-header>
      <mat-tab-group>
        @for (j of jobs; track j.company) {
          <mat-tab label="{{j.company}}">
            <app-work-experience [job]="j" />
          </mat-tab>
        }
      </mat-tab-group>
    </mat-expansion-panel>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Education</mat-panel-title>
      </mat-expansion-panel-header>
      <p>Here is some information about my education</p>
    </mat-expansion-panel>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Skills</mat-panel-title>
      </mat-expansion-panel-header>
      <mat-tab-group>
        <mat-tab label="Technical Skills">
          <p>Here is some info on my time at SelectHealth</p>
        </mat-tab>

        <mat-tab label="Frameworks">
          <p>Here is some info on my time at Motorola Solutions</p>
        </mat-tab>

        <mat-tab label="Personal Skills">
          <p>Here is some info on my time at Level Home Inc.</p>
        </mat-tab>
      </mat-tab-group>
    </mat-expansion-panel>
  </mat-accordion>
</div>
