<mat-card appearance="raised">
  <mat-card-header>
    <mat-card-title>{{project.name}}</mat-card-title>
  </mat-card-header>
  <img mat-card-image ngSrc="{{project.pic}}" alt="" width="300" height="200" />
  <mat-card-content>
    <p>{{project.summary}}</p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-raised-button (click)="openDialog(project.id)">View More</a>
  </mat-card-actions>
  <mat-card-footer>
    <mat-chip-set>
      @for(tag of project.tags; track tag) {
        <mat-chip [style]="'background-color: ' + tag.color">{{tag}}</mat-chip>
      }
    </mat-chip-set>
  </mat-card-footer>
</mat-card>
